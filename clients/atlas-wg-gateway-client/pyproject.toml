[project]
name = "atlas-wg-gateway-client"
version = "0.1.0"
description = "A client library for accessing Atlas WireGuard gateway"
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
