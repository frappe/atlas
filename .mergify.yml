pull_request_rules:
  - name: Close direct pull requests to master
    conditions:
      - base=master
      - author!=mergify[bot]
      - label!=manual-backport-pr
    actions:
      close:
      comment:
        message: |
          @{{author}}, `master` is the stable branch and accepts only backports. Raise this pull request on `develop` and add the `backport master` label.
          For a manual backport, add the `manual-backport-pr` label and reopen this pull request.

  - name: Backport to master
    conditions:
      - base=develop
      - label="backport master"
    actions:
      backport:
        branches:
          - master
        assignees:
          - "{{ author }}"

  - name: Keep pull requests up to date
    conditions:
      - -draft
      - -conflict
      - "#commits-behind>0"
    actions:
      update:

  - name: Close pull requests open for more than a month
    conditions:
      - -closed
      - created-at<30 days ago
      - author!=mergify[bot]
      - label!=keep-open
    actions:
      close:
      comment:
        message: |
          Hey @{{author}}, thanks for this pull request! It has been open for over a month, so we're closing it automatically to keep things tidy.

          Still working on it? Add the `keep-open` label and reopen it, or leave a comment and we'll help.
