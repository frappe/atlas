name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 'Release'
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v1.*.*' 2>/dev/null || true)

          if [ -z "$previous" ]; then
            version=v1.0.0
          elif [ -z "$(git rev-list "$previous..HEAD")" ]; then
            echo "::error::No commits since $previous"
            exit 1
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            # Merge commit bodies hold the pull request titles.
            if git log --format='%s%n%b' "$previous..HEAD" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              version="v$major.$((minor + 1)).0"
            else
              version="v$major.$minor.$((patch + 1))"
            fi
          fi

          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
