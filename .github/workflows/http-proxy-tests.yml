name: Atlas HTTP proxy tests

on:
  pull_request:
    paths:
      - "services/http-proxy/**"
  push:
    branches:
      - develop
    paths:
      - "services/http-proxy/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/http-proxy
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install control daemon unit test dependencies
        run: python -m pip install -e "control[test]"

      - name: Lint Python
        run: python -m ruff check control tests

      - name: Run control daemon unit tests
        run: python -m pytest -q control/tests

      - name: Start test stack
        run: docker compose -f tests/docker/docker-compose.yml up --build -d

      - name: Run integration tests
        run: python -m pytest -q tests

      - name: Stop test stack
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down -v
