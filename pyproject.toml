[project]
name = "atlas"
authors = [
    { name = "Frappe", email = "aditya@frappe.io"}
]
description = "Frappe Hosting Platform"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "boto3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
# Optional tools for the readability lint gate (.github/scripts/lint_gate.py): the
# maintainability-index and cognitive-complexity checks. The gate degrades gracefully
# when they are absent (the ruff + module-length checks still run), so these are a
# convenience for running the full gate locally — CI installs them explicitly.
radon = ">=5.1.0"
flake8-cognitive-complexity = ">=0.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# NOTE: the readability complexity/size gates (mccabe C901, pylint PLR09xx, nesting
# PLR1702, module length) are deliberately NOT in this enforced `select` — turning
# them on here would fail CI on the whole pre-existing backlog. They run instead as a
# delta-gate against a checked-in baseline (.github/scripts/lint_gate.py, wired into
# the "Readability lint gate" job in linter.yml) that fails only on NEW violations.
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]
# The placement/capacity docs use typographic − (minus) and × (times) in math
# expressions (e.g. "total − reserve", "2 GB × cores"), and the ANCP notes use ∪
# (set union) for key-set composition (e.g. "seeds ∪ persisted-membership-keys");
# whitelist just those confusables so RUF001/002/003 don't flag the intentional
# notation.
allowed-confusables = ["−", "×", "∪"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

# isort is configured to produce byte-identical output to ruff's import sorter
# (the `I` rule above), so the two never fight. If you change line-length,
# first-party packages, or the ruff format indent, mirror it here too.
[tool.isort]
profile = "black"
line_length = 110
indent = "\t"
known_first_party = ["atlas"]
split_on_trailing_comma = true

