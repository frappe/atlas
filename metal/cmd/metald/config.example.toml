# Example metald configuration.
# The tls section is required.

[metald]
# Stores VM, image, snapshot, and WireGuard state.
base_dir = "/var/lib/metal"
# TCP address or unix:/path.
listen = "127.0.0.1:8080"
# Mutual-TLS API for communication between Metal nodes.
coordination_listen = "[fdab::1]:9001"

[tls]
ca_file = "/var/lib/metal/tls/ca.crt"
certificate_file = "/var/lib/metal/tls/node.crt"
private_key_file = "/var/lib/metal/tls/node.key"
# Common name of the client certificate that Atlas presents.
atlas_common_name = "atlas.example.com"

[firecracker]
binary_path = "/usr/bin/firecracker"
# Short paths to VM API sockets.
sockets_dir = "/run/metal"
# Empty uses Firecracker's default guest CPU configuration.
cpu_template_file = ""

[jailer]
binary_path = "/usr/bin/jailer"
# VM's own directory, so removing that directory removes the jail with it.

[zfs]
# Existing ZFS pool for VM disks and images.
pool = "metal"

[wireguard]
# Underlay interface for managed peers and Atlas WG Mesh.
interface = "wg0"

[wg_mesh]
# Set false to disable Atlas WG Mesh on this host.
enabled = true
binary_path = "/usr/local/bin/atlas-wg-mesh"
# The shared VLAN interface that carries Atlas NDP. Atlas WG Mesh attaches its
# NDP hook and its proxy NDP entries here, so name the VLAN itself and never
# its parent. Required.
uplink = "eno1.1878"

[traffic_monitor]
# Set false to disable VM traffic monitoring on this host.
enabled = true

[migration]
# Final-delta threshold in MiB.
final_delta_mib = 512
# TCP port the source listens on for the disk stream. Use the same value on
# every host in the region.
transfer_port = 9002
# Require a guest SSH handshake before memory migration source cleanup.
check_guest_ssh = false
