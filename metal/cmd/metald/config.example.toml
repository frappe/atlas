# Example metald configuration. All keys are optional; each shows its default.
# Each section is named for the thing it configures. Pass this file with
# `metald serve --config /path/to/metald.toml`; metald otherwise reads
# /var/lib/metal/metald.toml. This file is the only way to change a key.

[metald]
# metald puts the machines and kernels directories under base_dir.
base_dir = "/var/lib/metal"
# API address; "host:port" for TCP, or "unix:/path" for a unix socket.
listen = "127.0.0.1:8080"

[firecracker]
binary_path = "/usr/bin/firecracker"
# Short symlinks to each VM's API socket. A unix address holds 108 bytes, and
# the path inside the jail is longer than that.
sockets_dir = "/run/metal"

[jailer]
binary_path = "/usr/bin/jailer"
# VM's own directory, so removing that directory removes the jail with it.

[zfs]
pool = "metal"
