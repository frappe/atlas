# Example metald configuration. All keys are optional; each shows its default.
# Pass this file with `metald serve --config /path/to/config.toml`, or place a
# config.toml in the working dir. A matching METALD_* env var overrides any key.

# API address; "host:port" for TCP, or "unix:/path" for a unix socket.
listen = "127.0.0.1:8080"

[firecracker]
chroot_base     = "/srv/jailer"          # jailer chroot base dir
var_dir         = "/var/lib/metal/vms"   # per-VM state dir
jailer_bin      = "/usr/bin/jailer"
firecracker_bin = "/usr/bin/firecracker"

[storage]
pool       = "metal"                     # ZFS pool name
kernel_dir = "/var/lib/metal/kernels"
images_dir = "/var/lib/metal/images"     # warm-image memory store
