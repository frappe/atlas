line-length = 110
# Must match PYTHON_VERSION in nginx/setup.sh.
target-version = "py314"
src = ["control", "tests"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
	"E501",  # line too long
	"UP031", # percent format, ignored repository-wide
]

[format]
quote-style = "double"
indent-style = "tab"
