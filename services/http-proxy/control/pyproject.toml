[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-proxy-control"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "ruff==0.16.5"]

[tool.setuptools.packages.find]
include = ["proxy_control*"]

[tool.fastapi]
entrypoint = "proxy_control.main:app"
