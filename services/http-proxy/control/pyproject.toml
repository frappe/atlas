[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-proxy-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
]

[tool.setuptools]
py-modules = ["main"]

[tool.fastapi]
entrypoint = "main:app"
