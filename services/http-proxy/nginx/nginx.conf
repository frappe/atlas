user  nginx;
worker_processes  auto;
pid  /run/nginx.pid;

events {
    worker_connections  65536;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log notice;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           15s;
    keepalive_timeout      10;

    client_max_body_size   50m;

    # Keep the trailing ;; so OpenResty's bundled Lua modules remain available.
    lua_package_path  "/etc/nginx/lua/?.lua;;";

    lua_shared_dict  sites  64m;
    # HTTP and stream use separate dictionaries, so domains are synchronized
    # through the private bridge socket below.
    lua_shared_dict  domains_http  16m;
    lua_shared_dict  meta  12k;

    init_by_lua_block {
        local persist = require("persist")
        ngx.shared.meta:set("sites_count", 0)
        ngx.shared.meta:set("domains_http_count", 0)
        local f = io.open("/var/lib/nginx/region", "r")
        if f then
            atlas_root_domain = (f:read("*l") or ""):gsub("%s+", "")
            f:close()
        else
            atlas_root_domain = ""
        end
    }
    init_worker_by_lua_block {
        require("persist").load()
        require("domains_http_persist").load()
    }

    ssl_certificate      /var/lib/nginx/certs/fullchain.pem;
    ssl_certificate_key  /var/lib/nginx/certs/privkey.pem;

    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers  off;
    ssl_ecdh_curve  X25519:prime256v1:secp384r1;

    ssl_session_timeout  1d;
    ssl_session_cache    shared:MozSSL:10m;
    ssl_session_tickets  off;

    # Port 80 serves wildcard ACME locally and forwards other HTTP traffic.
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        set $acme_upstream "";
        set $vm_upstream "";

        location ^~ /.well-known/acme-challenge/ {
            access_by_lua_file /etc/nginx/lua/acme_router.lua;
            proxy_pass $acme_upstream;
        }
        location @acme_local {
            internal;
            root /var/lib/nginx/acme;
        }

        location / {
            access_by_lua_file /etc/nginx/lua/plain_router.lua;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_pass $vm_upstream;
        }
    }

    # The stream listener sends wildcard TLS to this local HTTP terminator.
    server {
        listen      127.0.0.1:8443 ssl proxy_protocol;
        listen      [::1]:8443 ssl proxy_protocol;
        http2  on;
        server_name _;

        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header proxy_protocol;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        set $vm_upstream "";

        location /socket.io {
            access_by_lua_file /etc/nginx/lua/router.lua;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_pass $vm_upstream;
        }

        location / {
            access_by_lua_file /etc/nginx/lua/router.lua;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_pass $vm_upstream;
        }
    }

    # Unknown custom domains use the placeholder certificate and page.
    server {
        listen      127.0.0.1:8446 ssl proxy_protocol;
        listen      [::1]:8446 ssl proxy_protocol;
        server_name _;

        ssl_certificate     /var/lib/nginx/certs/_placeholder/fullchain.pem;
        ssl_certificate_key /var/lib/nginx/certs/_placeholder/privkey.pem;

        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header proxy_protocol;

        location / {
            content_by_lua_file /etc/nginx/lua/unconfigured.lua;
        }
    }

    # The controller uses this Unix socket instead of a public admin port.
    server {
        listen  unix:/run/nginx/admin.sock;
        access_log  /var/log/nginx/admin.log;

        location / {
            content_by_lua_file /etc/nginx/lua/admin.lua;
        }
    }
}

stream {
    log_format  stream_basic  '$remote_addr/$proxy_protocol_addr [$time_local] '
                              '$protocol $status $bytes_sent $bytes_received '
                              '$session_time "$server_port -> $upstream_addr"';
    access_log  /var/log/nginx/stream-access.log stream_basic;
    error_log   /var/log/nginx/error.log notice;

    lua_package_path  "/etc/nginx/lua/?.lua;;";

    # stream{} cannot use the HTTP dictionary.
    lua_shared_dict  domains  16m;

    lua_shared_dict  stream_meta  12k;

    init_by_lua_block {
        local f = io.open("/var/lib/nginx/region", "r")
        if f then
            atlas_root_domain = (f:read("*l") or ""):gsub("%s+", "")
            f:close()
        else
            atlas_root_domain = ""
        end
    }

    init_worker_by_lua_block {
        require("sni_persist").load()
    }

    # ssl_preread reads SNI without decrypting. Custom domains get PROXY v2.
    server {
        listen         443;
        listen         [::]:443;
        ssl_preread    on;
        proxy_protocol v2;

        preread_by_lua_file  /etc/nginx/lua/sni_router.lua;
        set $sni_upstream "";
        proxy_pass  $sni_upstream;

        proxy_timeout         1h;
        proxy_connect_timeout 5s;
    }

    # HTTP workers use this private socket to update stream-domain state.
    server {
        listen  unix:/run/nginx/sni-bridge.sock;
        content_by_lua_file /etc/nginx/lua/sni_bridge.lua;
    }
}
