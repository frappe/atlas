[Unit]
After=atlas-network.service

[Service]
# Clear the package commands before defining Atlas's command and config path.
ExecStartPre=
ExecStartPre=/usr/local/openresty/nginx/sbin/nginx -t -q -c /etc/nginx/nginx.conf -g 'daemon on; master_process on;'
ExecStart=
ExecStart=/usr/local/openresty/nginx/sbin/nginx -c /etc/nginx/nginx.conf -g 'daemon on; master_process on;'
ExecReload=
ExecReload=/usr/local/openresty/nginx/sbin/nginx -c /etc/nginx/nginx.conf -g 'daemon on; master_process on;' -s reload
PIDFile=/run/nginx.pid
ExecStop=
ExecStop=-/sbin/start-stop-daemon --quiet --stop --retry QUIT/5 --pidfile /run/nginx.pid
LimitNOFILE=1048576
Restart=on-failure
RuntimeDirectory=nginx
RuntimeDirectoryMode=0750
# The socket is group-readable by nginx, so the worker can reach the bridge.
ExecStartPre=/bin/chown root:nginx /run/nginx
ExecStartPost=/bin/chown root:nginx /run/nginx/sni-bridge.sock
ExecStartPost=/bin/chmod 0660 /run/nginx/sni-bridge.sock
