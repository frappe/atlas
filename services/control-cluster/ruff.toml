line-length = 110
# Must match the Python version of the services that install this package.
target-version = "py314"
src = ["."]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
	"E501",  # line too long
	"UP031", # percent format, ignored repository-wide
]

[format]
quote-style = "double"
indent-style = "tab"
